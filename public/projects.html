<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Eitan Alperstein</title>
    <meta name="description" content="Things Eitan Alperstein has built: apps, tools, games and experiments.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f0d;
            --surface: #151815;
            --surface-hover: #1b1f1b;
            --line: #262b26;
            --ink: #e8ebe7;
            --muted: #8d958c;
            --accent: #04ff00;
            --accent-soft: rgba(4, 255, 0, .12);
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #f6f7f5;
                --surface: #ffffff;
                --surface-hover: #f1f3f0;
                --line: #e0e3de;
                --ink: #151815;
                --muted: #5e665d;
                --accent: #0b8a08;
                --accent-soft: rgba(11, 138, 8, .1);
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.55 Inter, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; }
        .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

        header { padding: 72px 0 40px; }
        .back { font: 500 13px/1 "JetBrains Mono", monospace; color: var(--muted); text-decoration: none; }
        .back:hover { color: var(--accent); }
        h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.05; letter-spacing: -0.03em; margin: 20px 0 12px; }
        h1 span { color: var(--accent); }
        .lede { color: var(--muted); font-size: 18px; max-width: 560px; margin: 0; }

        h2 {
            font: 500 12px/1 "JetBrains Mono", monospace;
            text-transform: uppercase; letter-spacing: .12em;
            color: var(--muted); margin: 48px 0 16px;
        }

        .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px;
            display: flex; flex-direction: column; gap: 10px;
            transition: border-color .2s, background .2s, transform .2s;
        }
        .card:hover { border-color: var(--accent); background: var(--surface-hover); transform: translateY(-2px); }
        .card h3 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
        .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tags span {
            font: 400 12px/1 "JetBrains Mono", monospace;
            color: var(--accent); background: var(--accent-soft);
            padding: 5px 8px; border-radius: 6px;
        }
        .links { display: flex; gap: 16px; margin-top: 4px; }
        .links a { font: 500 13px/1 "JetBrains Mono", monospace; text-decoration: none; color: var(--ink); }
        .links a:hover { color: var(--accent); }
        .links .private { font: 400 13px/1 "JetBrains Mono", monospace; color: var(--muted); }

        .list { display: grid; border-top: 1px solid var(--line); }
        .row {
            display: grid; grid-template-columns: 200px 1fr auto; gap: 20px; align-items: baseline;
            padding: 16px 4px; border-bottom: 1px solid var(--line);
        }
        .row h3 { margin: 0; font-size: 16px; }
        .row p { margin: 0; color: var(--muted); font-size: 15px; }
        .row .links { margin: 0; }

        footer { padding: 64px 0 48px; color: var(--muted); font-size: 14px; }
        footer a { color: var(--ink); }

        @media (max-width: 640px) {
            .wrap { padding: 0 16px; }
            header { padding-top: 48px; }
            .grid { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <a class="back" href="/">← eitanalperstein.com</a>
            <h1>Things I've <span>built</span>.</h1>
            <p class="lede">Apps, tools, games and experiments: from a student newspaper's website to a guitar-tab reader for macOS.</p>
        </header>

        <main>
            <h2>Featured</h2>
            <div class="grid" id="featured"></div>

            <h2>More projects</h2>
            <div class="list" id="more"></div>
        </main>

        <footer>
            More on <a href="https://github.com/Eitan-Alperstein">GitHub</a>.
        </footer>
    </div>

    <script>
        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))

        function links(p) {
            const out = []
            if (p.url) out.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">Live ↗</a>`)
            if (p.repo) out.push(`<a href="${esc(p.repo)}" target="_blank" rel="noopener">Code ↗</a>`)
            if (!p.url && !p.repo) out.push(`<span class="private">Private project</span>`)
            return `<div class="links">${out.join("")}</div>`
        }

        fetch("/projects.json")
            .then(r => r.json())
            .then(projects => {
                document.getElementById("featured").innerHTML = projects.filter(p => p.featured).map(p => `
                    <article class="card">
                        <h3>${esc(p.title)}</h3>
                        <p>${esc(p.blurb)}</p>
                        <div class="tags">${p.stack.map(t => `<span>${esc(t)}</span>`).join("")}</div>
                        ${links(p)}
                    </article>`).join("")

                document.getElementById("more").innerHTML = projects.filter(p => !p.featured).map(p => `
                    <div class="row">
                        <h3>${esc(p.title)}</h3>
                        <p>${esc(p.blurb)}</p>
                        ${links(p)}
                    </div>`).join("")
            })
    </script>
</body>
</html>
