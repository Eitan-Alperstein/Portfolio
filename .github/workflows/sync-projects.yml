# Keeps the homepage project list in sync with GitHub topics.
# Snapshots public repos tagged `portfolio` into src/data/github-projects.json
# (see README.md → "How to add a project"). If anything changed, it checks the
# site still builds and commits to main, which triggers Vercel's production deploy.
name: Sync projects from GitHub

on:
  schedule:
    - cron: "17 12 * * *" # daily, 12:17 UTC (6:17 am in Denver during daylight time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change; don't commit"
        type: boolean
        default: false
  repository_dispatch:
    types: [sync-projects] # "sync now" from anywhere: POST /repos/Eitan-Alperstein/Portfolio/dispatches

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Snapshot portfolio repos
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/github-projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the project list."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- src/data/github-projects.json
          fi

      - name: Make sure the site still builds
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit to main
        # Only ever commits on main (scheduled and repository_dispatch runs use main;
        # manual runs commit only when started on main without dry_run).
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json
          git commit -m "Sync project list from GitHub topics" -m "Automated by .github/workflows/sync-projects.yml"
          git push

      - name: Dry run summary
        if: steps.diff.outputs.changed == 'true' && (github.ref != 'refs/heads/main' || inputs.dry_run == true)
        run: echo "Changes found, but not committing (dry run or not on main)."
